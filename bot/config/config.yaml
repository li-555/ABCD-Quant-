# =============================================================================
# Roostoo live trading bot - configuration
# All strategy / risk / execution parameters live here.  Secrets are NOT stored
# in this file; they are injected via environment variables (see .env.example).
# =============================================================================

# ---- timing ----------------------------------------------------------------
bar_min: 30                      # 30-minute bars
loop_seconds: 1800               # scheduler period (aligned to bar closes)
rebalance_hour_utc: 0            # daily rebalance fires after UTC 00:00

# ---- selection -------------------------------------------------------------
n_long: 6
hold_rank_long: 10
gate_thr: 0.2                    # asset eligible if slow signal > gate_thr
entry_thr: 0.2                   # asset entered if score > entry_thr

# ---- slow-layer signal windows (hours) --------------------------------------
vol_h: 48
slow_fast_h: 48
slow_slow_h: 192
mom_h: 120
don_h: 480
overheat_h: 24
overheat_z: 2.5
w_trend: 0.4
w_mom: 0.4
w_don: 0.2

# ---- risk / sizing ---------------------------------------------------------
sigma_target: 0.04               # daily portfolio vol target
cov_h: 120                      # covariance window (hours)
single_long: 0.35                # per-asset long cap
single_short: 0.12               # per-asset short cap (unused, long-only)
coin_cap: 0.70                   # net exposure cap for the coin cluster
gross_mult: 1.5                  # cluster gross cap = gross_mult * coin_cap
regime_lo: 0.25
regime_span: 0.5
regime_floor: 0.5
dd_scale: 0.10
dd_hard: 0.12
dd_window_h: 336                 # drawdown peak window (hours)
breaker_h: 12                    # circuit-breaker duration (hours)
min_scale: 0.5                   # minimum post-drawdown scale

# ---- trading behaviour -----------------------------------------------------
band_abs: 0.08                   # no-trade band (absolute weight)
band_rel: 0.30                   # no-trade band (relative to target)
min_trade: 0.005                 # minimum traded weight
min_hold_h: 12                   # minimum holding time (hours)
stop_long: 1.5                   # trailing stop distance (daily sigmas)
stop_short: 1.2                  # short stop (unused, long-only)
cool_h: 3                        # cooldown after a stop (hours)
allow_short: false
max_gross: 1.0                   # total gross exposure cap

# ---- cost model (bps) - model only; live records actual commission ---------
maker_bps: 5.0
taker_bps: 10.0
slip_bps: 2.0

# ---- data ------------------------------------------------------------------
history_days: 60                 # klines to warm up on startup
max_history_days: 90
price_deviation_pct: 2.0         # Binance vs Roostoo price sanity check
staleness_minutes: 90            # skip cycle if newest bar older than this
binance_hosts:
  - "https://data-api.binance.vision"
  - "https://api.binance.com"
  - "https://api.binance.us"

# ---- execution -------------------------------------------------------------
limit_timeout_minutes: 10.0
max_order_frac: 0.15             # max notional per single order (frac of equity)
max_daily_trades: 200            # safety cap on fills per day
rate_limit_seconds: 1.0          # min spacing between API calls

# ---- activity guard (compliance) -------------------------------------------
activity_enabled: true
min_daily_trades: 2
activity_notional_frac: 0.005

# ---- runtime / paths -------------------------------------------------------
live: false                      # overridden by env LIVE=1
paper_start_equity: 100000.0
kill_file: "bot/KILL"
heartbeat_file: "bot/logs/heartbeat.json"
log_dir: "bot/logs"
log_max_bytes: 5000000
equity_csv: "bot/logs/equity.csv"
state_file: "bot/state.json"
data_dir: "cache"
